name: 问题反馈
description: 报告 BrickBookmark 使用中的问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 issue，并**不要填写账号、密码、书签内容、浏览记录等隐私信息**。

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome
        - Edge
        - Firefox
        - 其他 Chromium（360 / Brave / Arc / Vivaldi 等）
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: 扩展版本
      options:
        - "0.15.0"
        - "0.14.5"
        - "0.14.4"
        - "0.14.3"
        - "0.14.2 及更早"
        - "其他（请在正文注明）"
    validations:
      required: true

  - type: input
    id: browser_version
    attributes:
      label: 浏览器版本
      placeholder: 如 131.0.6778.86
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 如 Windows 11 / macOS 15
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 书签 Tab（浏览 / 搜索 / 排序 / 编辑书签）
        - 侧边栏
        - 文件夹 Tab
        - 标签 Tab
        - 工具 Tab
        - 设置 Tab
        - 账号 / 服务器功能
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 可直接拖拽图片到此处
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 issue，确认不是重复
          required: true
        - label: 我没有在内容中填写账号、密码、书签或浏览记录等隐私信息
          required: true
