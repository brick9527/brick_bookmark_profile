name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索已有 issue；描述越具体，越容易判断是否纳入规划。

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 书签 Tab（浏览 / 搜索 / 排序 / 编辑书签）
        - 侧边栏
        - 文件夹 Tab
        - 标签 Tab
        - 工具 Tab
        - 设置 Tab
        - 账号 / 服务器功能
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题
      description: 当前使用中的不便或缺失
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、参考链接等
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 issue，确认不是重复
          required: true
